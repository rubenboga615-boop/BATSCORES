<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BATSCORES - Scores de football en direct</title>
  <meta name="description" content="BATSCORES : resultats en direct, calendriers, classements, compositions et statistiques du football mondial." />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="app-bar">
    <div class="app-bar__inner">
      <a class="brand" href="#/" aria-label="BATSCORES, accueil">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" role="presentation">
            <circle cx="16" cy="16" r="15" fill="currentColor" />
            <path d="M16 6l6 4.4-2.3 7.1h-7.4L10 10.4z" fill="#0d1117" />
            <path d="M16 6V3M22 10.4l2.8-1.1M19.7 17.5l4.4 2M12.3 17.5l-4.4 2M10 10.4L7.2 9.3" stroke="#0d1117" stroke-width="1.6" fill="none" />
          </svg>
        </span>
        <span class="brand__text">BAT<span class="brand__accent">SCORES</span></span>
      </a>

      <form class="search" role="search" id="search-form" autocomplete="off">
        <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M10.5 3a7.5 7.5 0 105.06 13.06l4.19 4.19 1.41-1.41-4.19-4.19A7.5 7.5 0 0010.5 3zm0 2a5.5 5.5 0 110 11 5.5 5.5 0 010-11z" fill="currentColor" />
        </svg>
        <input type="search" id="search-input" placeholder="Equipe ou competition..." aria-label="Rechercher une equipe ou une competition" />
      </form>

      <nav class="app-nav" aria-label="Navigation principale">
        <a href="#/" data-nav="matches">Matchs</a>
        <a href="#/live" data-nav="live">
          Direct <span class="live-badge" id="live-count" hidden>0</span>
        </a>
        <a href="#/competitions" data-nav="competitions">Competitions</a>
        <a href="#/favoris" data-nav="favorites">
          Favoris <span class="fav-badge" id="fav-count" hidden>0</span>
        </a>
        <a href="#/collecte" data-nav="collector">Collecte</a>
      </nav>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <nav class="tab-bar" aria-label="Navigation mobile">
    <a href="#/" data-nav="matches">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 2h10v2h3v6a5 5 0 01-4.1 4.9A5 5 0 0113 18.9V20h3v2H8v-2h3v-1.1a5 5 0 01-2.9-4A5 5 0 014 10V4h3V2zm0 4H6v4a3 3 0 002 2.8V6zm10 0v6.8A3 3 0 0019 10V6h-2z" fill="currentColor"/></svg>

    </a>
    <a href="#/live" data-nav="live">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 3a7 7 0 110 14 7 7 0 010-14zm0 3.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z" fill="currentColor"/></svg>
      <span>Direct</span>
    </a>
    <a href="#/competitions" data-nav="competitions">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 3h14v2h3v3a4 4 0 01-3.5 4A6 6 0 0113 16.9V19h4v2H7v-2h4v-2.1A6 6 0 015.5 12 4 4 0 012 8V5h3V3zm0 4H4v1a2 2 0 001 1.7V7zm15 0h-1v2.7A2 2 0 0020 8V7z" fill="currentColor"/></svg>
      <span>Competitions</span>

    <a href="#/favoris" data-nav="favorites">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 17.3l-6.2 3.7 1.7-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.5 4.8 1.7 7z" fill="currentColor"/></svg>
      <span>Favoris</span>
    </a>
    <a href="#/collecte" data-nav="collector">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zm0 4.5c0 1.7 3.6 3 8 3s8-1.3 8-3V8c0 1.7-3.6 3-8 3s-8-1.3-8-3v2.5zm0 5c0 1.7 3.6 3 8 3s8-1.3 8-3V13c0 1.7-3.6 3-8 3s-8-1.3-8-3v2.5zM4 18v2c0 1.7 3.6 3 8 3s8-1.3 8-3v-2c0 1.7-3.6 3-8 3s-8-1.3-8-3z" fill="currentColor"/></svg>
      <span>Collecte</span>

  <script type="module" src="/js/app.js"></script>

</html>
